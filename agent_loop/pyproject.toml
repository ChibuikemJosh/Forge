[project]
name = "forgeguard-loop"
version = "0.1.0"
description = "Agentic loop to find custom security vulnerabilities and propose fixes"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeguard_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
